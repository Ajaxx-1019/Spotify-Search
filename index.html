<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Downloader Mobile</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background: #121212; color: white; }
        input { padding: 12px; width: 85%; max-width: 350px; margin-bottom: 12px; border-radius: 8px; border: none; font-size: 16px; background: #242424; color: white; }
        input:focus { outline: 2px solid #1DB954; }
        button { padding: 12px 24px; background: #1DB954; color: white; border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1ed760; }
        
        .spinner {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #1DB954;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #result { margin-top: 25px; padding: 20px; border: 1px solid #282828; display: none; border-radius: 12px; background: #181818; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
        img { width: 180px; border-radius: 8px; margin: 10px 0; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background: #ffffff; color: black; text-decoration: none; border-radius: 25px; font-weight: bold; font-size: 16px; }
        .status-text { color: #b3b3b3; margin-top: 15px; font-style: italic; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🎵 Spotify MP3 Downloader</h2>
    <p style="color: #b3b3b3; margin-bottom: 25px;">Cari dan download lagu langsung lewat browser HP</p>
    
    <input type="text" id="query" placeholder="Ketik judul lagu di sini...">
    <br>
    <button id="searchBtn" onclick="cariLagu()">Cari Lagu</button>
    
    <div id="loadingSpinner" class="spinner"></div>
    <p id="status" class="status-text"></p>

    <div id="result">
        <h3 id="title" style="margin: 5px 0;">Judul Lagu</h3>
        <p id="artist" style="color: #1DB954; margin: 5px 0; font-weight: bold;">Artis</p>
        <img id="thumb" src="" alt="Cover Album">
        <br>
        <a id="downloadLink" class="download-btn" href="#" target="_blank">📥 Klik untuk Download MP3</a>
    </div>

    <script>
        async function cariLagu() {
            const query = document.getElementById('query').value.trim();
            if(!query) return alert('Ketik dulu judul lagunya!');
            
            const resultDiv = document.getElementById('result');
            const statusTxt = document.getElementById('status');
            const spinner = document.getElementById('loadingSpinner');
            const searchBtn = document.getElementById('searchBtn');
            
            resultDiv.style.display = 'none';
            statusTxt.innerText = 'Menghubungi API via Proxy, tunggu sebentar...';
            spinner.style.display = 'block';
            searchBtn.disabled = true;
            
            try {
                // 🛠️ MEMAKAI ALLORIGINS PROXY UNTUK MENEMBUS BLOKIR BROWSER HP
                const targetUrl = `https://nexadev.my.id{encodeURIComponent(query)}`;
                const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                spinner.style.display = 'none';
                searchBtn.disabled = false;
                
                if(data.status && data.result) {
                    const lagu = data.result;
                    
                    document.getElementById('title').innerText = lagu.title;
                    document.getElementById('artist').innerText = 'Artis: ' + lagu.artist;
                    document.getElementById('thumb').src = lagu.thumbnail || lagu.image;
                    document.getElementById('downloadLink').href = lagu.download_url;
                    
                    statusTxt.innerText = '✅ Selesai! Klik tombol di bawah untuk mengunduh.';
                    resultDiv.style.display = 'block';
                } else {
                    statusTxt.innerText = '❌ Gagal memproses.';
                    alert('Lagu tidak ditemukan atau respons API kosong.');
                }
            } catch (error) {
                spinner.style.display = 'none';
                searchBtn.disabled = false;
                statusTxt.innerText = '❌ Koneksi bermasalah.';
                alert('Proxy sedang sibuk. Silakan coba klik tombol Cari lagi.');
                console.error(error);
            }
        }
    </script>
</body>
</html>
